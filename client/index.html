<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Quickart - Quick Commerce | Fresh Groceries Delivered in Minutes</title>
    <meta name="title" content="Quickart - Quick Commerce | Fresh Groceries Delivered in Minutes" />
    <meta name="description" content="Order fresh groceries, fruits, vegetables & daily essentials online. Get free delivery in 10 minutes! Best prices on milk, bread, eggs & more. Shop now at Quickart." />
    <meta name="keywords" content="quick commerce, grocery delivery, online grocery, fresh vegetables, milk delivery, instant delivery, 10 minute delivery, quickart" />
    <meta name="author" content="Quickart" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://quickart.com/" />
    <meta property="og:title" content="Quickart - Quick Commerce | Fresh Groceries Delivered in Minutes" />
    <meta property="og:description" content="Order fresh groceries, fruits, vegetables & daily essentials online. Get free delivery in 10 minutes!" />
    <meta property="og:image" content="/logo.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://quickart.com/" />
    <meta property="twitter:title" content="Quickart - Quick Commerce | Fresh Groceries Delivered in Minutes" />
    <meta property="twitter:description" content="Order fresh groceries, fruits, vegetables & daily essentials online. Get free delivery in 10 minutes!" />
    <meta property="twitter:image" content="/logo.png" />
    
    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://maps.googleapis.com" />

    <!-- Google Maps is loaded dynamically by components with the API key from environment variables -->

    <!-- Theme Color -->
    <meta name="theme-color" content="#DC2626" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
